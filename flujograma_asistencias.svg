<svg width="680" height="920" viewBox="0 0 680 920" xmlns="http://www.w3.org/2000/svg" style="background:white; font-family: Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Inicio -->
  <rect x="240" y="20" width="200" height="52" rx="26" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="340" y="51" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">Inicio de sesión</text>

  <line x1="340" y1="72" x2="340" y2="108" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Decision usuario -->
  <rect x="220" y="108" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#444441">¿Qué tipo de usuario?</text>
  <text x="340" y="152" text-anchor="middle" font-size="12" fill="#5F5E5A">Maestro o estudiante</text>

  <!-- Flecha izquierda Maestro -->
  <line x1="220" y1="136" x2="100" y2="136" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="160" y="126" text-anchor="middle" font-size="12" fill="#378ADD">Maestro</text>

  <!-- Flecha derecha Estudiante -->
  <line x1="460" y1="136" x2="580" y2="136" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="520" y="126" text-anchor="middle" font-size="12" fill="#1D9E75">Estudiante</text>

  <!-- Dashboard maestro -->
  <rect x="20" y="108" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="100" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">Dashboard</text>
  <text x="100" y="152" text-anchor="middle" font-size="12" fill="#185FA5">Panel del maestro</text>

  <!-- Inicio estudiante -->
  <rect x="500" y="108" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="580" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">Inicio estudiante</text>
  <text x="580" y="152" text-anchor="middle" font-size="12" fill="#0F6E56">Vista del estudiante</text>

  <!-- Flujo maestro -->
  <line x1="100" y1="164" x2="100" y2="230" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="20" y="230" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="100" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">Crear sesión</text>
  <text x="100" y="272" text-anchor="middle" font-size="12" fill="#185FA5">Define cantidad tokens</text>

  <line x1="100" y1="286" x2="100" y2="350" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="20" y="350" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="100" y="374" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">Generar QR</text>
  <text x="100" y="392" text-anchor="middle" font-size="12" fill="#185FA5">phpQRCode + tokens</text>

  <line x1="100" y1="406" x2="100" y2="470" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="20" y="470" width="160" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="100" y="492" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">QR visible en pantalla</text>

  <!-- Flujo estudiante baja -->
  <line x1="580" y1="164" x2="580" y2="470" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="500" y="470" width="160" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="580" y="492" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">Escanea el QR</text>

  <!-- Flecha escaneo -->
  <line x1="180" y1="492" x2="498" y2="492" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="340" y="483" text-anchor="middle" font-size="12" fill="#5F5E5A">Estudiante escanea</text>

  <!-- Verificación tokens -->
  <line x1="580" y1="514" x2="580" y2="570" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="460" y="570" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="580" y="594" text-anchor="middle" font-size="14" font-weight="bold" fill="#444441">¿Hay tokens disponibles?</text>
  <text x="580" y="612" text-anchor="middle" font-size="12" fill="#5F5E5A">scan.php verifica</text>

  <!-- No hay tokens -->
  <line x1="460" y1="598" x2="360" y2="598" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="408" y="589" text-anchor="middle" font-size="12" fill="#E24B4A">No</text>
  <rect x="200" y="570" width="160" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="280" y="594" text-anchor="middle" font-size="14" font-weight="bold" fill="#791F1F">QR expirado</text>
  <text x="280" y="612" text-anchor="middle" font-size="12" fill="#A32D2D">Sin cupo disponible</text>

  <!-- Registrar asistencia -->
  <line x1="580" y1="626" x2="580" y2="690" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="618" y="662" font-size="12" fill="#1D9E75">Sí</text>
  <rect x="460" y="690" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="580" y="714" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">Registrar asistencia</text>
  <text x="580" y="732" text-anchor="middle" font-size="12" fill="#0F6E56">Guarda en BD + descuenta token</text>

  <!-- Confirmacion -->
  <line x1="580" y1="746" x2="580" y2="810" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="460" y="810" width="240" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="580" y="834" text-anchor="middle" font-size="14" font-weight="bold" fill="#27500A">Asistencia confirmada</text>
  <text x="580" y="852" text-anchor="middle" font-size="12" fill="#3B6D11">Página de confirmación</text>

  <!-- Leyenda -->
  <rect x="20" y="870" width="10" height="10" rx="2" fill="#378ADD"/>
  <text x="36" y="880" font-size="12" fill="#444441">Flujo maestro</text>
  <rect x="120" y="870" width="10" height="10" rx="2" fill="#1D9E75"/>
  <text x="136" y="880" font-size="12" fill="#444441">Flujo estudiante</text>
  <rect x="230" y="870" width="10" height="10" rx="2" fill="#E24B4A"/>
  <text x="246" y="880" font-size="12" fill="#444441">Error / sin tokens</text>
</svg>
